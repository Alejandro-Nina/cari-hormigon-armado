<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARI · Hormigón armado</title>
  <style>
    :root {
      --bg: #071620;
      --panel: #0d1c2a;
      --panel-2: #102638;
      --line: #1d3549;
      --text: #eaf3ff;
      --muted: #8ca2b8;
      --accent: #2b8cff;
      --accent-2: #3dd78a;
      --danger: #ff6b6b;
      --shadow: rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #071620 0%, #0a1d2d 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 32px;
    }

    .card {
      width: min(1100px, 100%);
      background: rgba(10, 26, 36, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 45px var(--shadow);
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.02);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(1.4rem, 2vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f7c77c, #d87041);
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.15);
    }

    .logo::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 6px;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(0,0,0,.15);
    }

    .badge {
      font-size: 0.72rem;
      background: rgba(62, 176, 255, 0.12);
      color: #9ecaef;
      border: 1px solid rgba(62,176,255,.28);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 600;
    }

    .main {
      display: grid;
      grid-template-columns: 1.5fr 0.7fr;
      min-height: 620px;
    }

    .content {
      padding: 32px;
      border-right: 1px solid var(--line);
    }

    .content h1 {
      margin: 0 0 18px;
      font-size: clamp(2.3rem, 4vw, 3.6rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .card-block {
      margin-top: 26px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.012);
      overflow: hidden;
    }

    .block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.015);
    }

    .block-header strong {
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      color: var(--accent-2);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .block-body {
      padding: 22px 20px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.15rem;
    }

    .sidebar {
      padding: 28px 22px;
      background: rgba(255,255,255,.01);
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .info-box {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .value small {
      color: var(--muted);
      font-weight: 500;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid rgba(59, 140, 255, 0.4);
      color: #dfeeff;
      background: linear-gradient(180deg, #123d5f, #0d2a43);
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn.primary {
      background: linear-gradient(180deg, #25c07d, #1d9e64);
      border-color: rgba(61, 215, 138, 0.5);
      color: white;
    }

    @media (max-width: 820px) {
      .main {
        grid-template-columns: 1fr;
      }
      .content {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .header {
        padding: 20px 18px;
      }
      .content, .sidebar {
        padding: 20px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>CARI · Hormigón armado</span>
      </div>
      <span class="badge">Público</span>
    </header>

    <div class="main">
      <main class="content">
        <h1>cari-hormigon-armado</h1>

        <div class="card-block">
          <div class="block-header">
            <strong>Proyecto</strong>
            <span class="status">Activo</span>
          </div>
          <div class="block-body">
            Aplicación web para diseño preliminar estructural y cálculo de hormigón armado.
          </div>
        </div>
      </main>

      <aside class="sidebar">
        <div class="meta">
          <div class="info-box">
            <div class="label">Estado</div>
            <div class="value">Listo para publicar</div>
          </div>

          <div class="info-box">
            <div class="label">Tipo</div>
            <div class="value">Single Page App</div>
          </div>

          <div class="info-box">
            <div class="label">Acción</div>
            <a class="btn primary" href="https://alejandro-nina.github.io/cari-hormigon-armado/" target="_blank" rel="noreferrer">
              Ver demo
            </a>
          </div>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
